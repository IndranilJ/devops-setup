apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-sa
  namespace: devops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-role
  namespace: devops
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-rolebinding
  namespace: devops
subjects:
  - kind: ServiceAccount
    name: backup-sa
    namespace: devops
roleRef:
  kind: Role
  name: backup-role
  apiGroup: rbac.authorization.k8s.io
