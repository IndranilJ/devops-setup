apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nexus
  namespace: devops
  labels:
    app.kubernetes.io/name: nexus
    app.kubernetes.io/part-of: devops-stack
spec:
  serviceName: nexus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus
    spec:
      securityContext:
        fsGroup: 200
        runAsUser: 200
      initContainers:
        - name: fix-permissions
          image: busybox:1.36.1
          command: ["sh", "-c", "chown -R 200:200 /nexus-data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: nexus-data
              mountPath: /nexus-data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      containers:
        - name: nexus
          image: sonatype/nexus3:3.68.0
          ports:
            - containerPort: 8081
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /service/rest/v1/status
              port: 8081
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /service/rest/v1/status
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: nexus-data
              mountPath: /nexus-data
        - name: gcloud-backup
          image: google/cloud-sdk:502.0.0-alpine
          env:
            - name: HOME
              value: /tmp
          command: ["sh", "-c", "tail -f /dev/null"]
          volumeMounts:
            - name: nexus-data
              mountPath: /nexus-data
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
      volumes:
        - name: nexus-data
          persistentVolumeClaim:
            claimName: nexus-pvc
