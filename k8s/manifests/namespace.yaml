apiVersion: v1
kind: Namespace
metadata:
  name: devops
  labels:
    app.kubernetes.io/part-of: devops-stack
---
# ResourceQuota governs the devops namespace.
# Limits are set to accommodate 4 base services + Jenkins build agents.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: devops-quota
  namespace: devops
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 10Gi
    limits.cpu: "6"
    limits.memory: 14Gi
